[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assetcut"
version = "0.1.0"
description = "Local CLI for removing backgrounds from game assets and exporting real transparent PNGs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Andre Glegg" }]
license = { text = "MIT" }
dependencies = [
  "typer>=0.12.5",
  "rich>=13.7.1",
  "Pillow>=10.4.0",
  "numpy>=1.26.4",
  "opencv-python-headless>=4.10.0.84"
]

[project.optional-dependencies]
rembg = [
  "rembg[cpu]>=2.0.59"
]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.6.8",
  "mypy>=1.11.2",
  "types-Pillow>=10.2.0.20240822"
]
inspyrenet = [
  "transparent-background>=1.3.3"
]
mcp = [
  "mcp>=1.16,<2"
]

[project.scripts]
assetcut = "assetcut.cli:app"
assetcut-mcp = "assetcut.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2", "mcp.*", "rembg", "transparent_background"]
ignore_missing_imports = true
